services:
  postgres:
    image: postgres:17
    container_name: world-explorer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: world_explorer
      POSTGRES_PASSWORD: world_explorer_dev
      POSTGRES_DB: world_explorer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world_explorer -d world_explorer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: